async function aiSend(){if(busy)return;var q=$("aiq").value.trim();if(!q)return;busy=true;$("ai-send").disabled=true;

 try{var s=await sampleFn(),turns=HIST.slice(0,-1).slice(-8).map(function(m){return{role:m.role,content:m.content}});

 try{var s=await sampleFn();var r=await s.json("You are a senior infectious diseases / family medicine consultant supporting a Malaysian doctor. "+KB+"\n"+ctx()+"\nCASE: "+q+"\n\nReturn ONLY a JSON object with keys: condition (string), antibioticIndicated (true/false), confidence ('high'|'medium'|'low'), redFlags (array of strings, empty if none), escalate (true if ED/referral is needed), reasoning (string, 2-4 sentences), regimen (null or object {drug,dose,frequency,duration,instructions}), allergyAlternative (null or string), childDose (null or string with mg/kg and mL guidance), investigations (array), safetyNet (array of strings), followUp (string), stewardshipPearl (string).",{modelTier:"complex",cache:false});

  if(r.regimen)h+='<div class="box a"><b>'+esc(r.regimen.drug||"")+'</b>'+esc([r.regimen.dose,r.regimen.frequency,r.regimen.duration].filter(Boolean).join(" · "))+'<br>'+esc(r.regimen.instructions||"")+'</div>';

  if(r.investigations&&r.investigations.length)h+='<h3>Investigations</h3>'+ul(r.investigations);if(r.safetyNet&&r.safetyNet.length)h+='<h3>Safety-net</h3>'+ul(r.safetyNet);

  $("ai-addc").onclick=function(){addCase("AI case analysis",(r.condition||"")+": "+(r.antibioticIndicated?"antibiotic indicated. ":"no antibiotic. ")+(r.regimen?[r.regimen.drug,r.regimen.dose,r.regimen.frequency,r.regimen.duration].join(" "):"")+" | "+(r.reasoning||""))}}
 catch(e){$("ai-struct").innerHTML='<div class="box r">'+esc(aiErr(e))+'</div>'}
